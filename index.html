<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2F6F66" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>رفيق</title>
    <link rel="preload" href="/fonts/ibm-plex-sans-arabic-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-sans-arabic-400.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'IBM Plex Sans Arabic';
        font-style: normal;
        font-display: block;
        font-weight: 400;
        src: url('/fonts/ibm-plex-sans-arabic-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Sans Arabic';
        font-style: normal;
        font-display: block;
        font-weight: 500;
        src: url('/fonts/ibm-plex-sans-arabic-500.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Sans Arabic';
        font-style: normal;
        font-display: block;
        font-weight: 600;
        src: url('/fonts/ibm-plex-sans-arabic-600.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Sans Arabic';
        font-style: normal;
        font-display: block;
        font-weight: 700;
        src: url('/fonts/ibm-plex-sans-arabic-700.woff2') format('woff2');
      }
      /* No page scrollbar behind the splash; it comes back when the splash is removed. */
      html:has(#splash) { overflow: hidden; }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px 24px max(28px, env(safe-area-inset-bottom));
        background: radial-gradient(circle at 50% 40%, #e1eee9 0%, #f3f6f4 62%);
        color: #17302b;
        font-family: 'IBM Plex Sans Arabic', 'Noto Naskh Arabic', system-ui, sans-serif;
        transition: opacity 350ms ease;
      }
      #splash.splash-hide { opacity: 0; pointer-events: none; }
      /* Everything is on screen from the first frame; only the exit moves. */
      #splash .logo {
        flex: none;
        width: 116px;
        height: 116px;
        margin-bottom: 18px;
        border-radius: 50%;
        background: #2f6f66;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 0 12px rgba(47, 111, 102, 0.1), 0 0 0 26px rgba(47, 111, 102, 0.05);
      }
      /* The letter is a drawn shape, not text, so it cannot change size when the font loads. */
      #splash .logo svg { width: auto; height: 54px; fill: #fff; }
      #splash .name { font-size: 36px; font-weight: 700; line-height: 1.3; }
      #splash .tagline { font-size: 16px; color: #51655f; }
      #splash .note { position: absolute; bottom: max(28px, env(safe-area-inset-bottom)); font-size: 13px; color: #51655f; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) #splash { background: radial-gradient(circle at 50% 40%, #1b322c 0%, #0f1b18 62%); color: #e6f0ec; }
        :root:not([data-theme='light']) #splash .tagline, :root:not([data-theme='light']) #splash .note { color: #a3b6b0; }
        :root:not([data-theme='light']) #splash .logo { background: #3f8f84; box-shadow: 0 0 0 12px rgba(63, 143, 132, 0.16), 0 0 0 26px rgba(63, 143, 132, 0.08); }
      }
      :root[data-theme='dark'] #splash { background: radial-gradient(circle at 50% 40%, #1b322c 0%, #0f1b18 62%); color: #e6f0ec; }
      :root[data-theme='dark'] #splash .tagline, :root[data-theme='dark'] #splash .note { color: #a3b6b0; }
      :root[data-theme='dark'] #splash .logo { background: #3f8f84; box-shadow: 0 0 0 12px rgba(63, 143, 132, 0.16), 0 0 0 26px rgba(63, 143, 132, 0.08); }
      @media (prefers-reduced-motion: reduce) {
        #splash { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="logo"><svg viewBox="-60 -323 324 563" aria-hidden="true"><path transform="scale(1 -1)" d="M-60 -90H-20Q71 -90 113.5 -53.0Q156 -16 155 70Q155 93 152.0 118.5Q149 144 144 173L123 306L232 323L247 230Q255 182 259.5 141.5Q264 101 264 75Q264 3 246.0 -55.0Q228 -113 192.0 -154.5Q156 -196 103.0 -218.0Q50 -240 -19 -240H-60Z"/></svg></div>
      <div class="name">رفيق</div>
      <div class="tagline">يرافقني في رحلة العناية بنفسي</div>
      <div class="note">بياناتي تبقى على جهازي</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
