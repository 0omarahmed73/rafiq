<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2F6F66" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>رفيق</title>
    <link rel="preload" href="/fonts/ibm-plex-sans-arabic-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-sans-arabic-400.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'IBM Plex Sans Arabic';
        font-style: normal;
        font-display: swap;
        font-weight: 400;
        src: url('/fonts/ibm-plex-sans-arabic-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Sans Arabic';
        font-style: normal;
        font-display: swap;
        font-weight: 500;
        src: url('/fonts/ibm-plex-sans-arabic-500.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Sans Arabic';
        font-style: normal;
        font-display: swap;
        font-weight: 600;
        src: url('/fonts/ibm-plex-sans-arabic-600.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Sans Arabic';
        font-style: normal;
        font-display: swap;
        font-weight: 700;
        src: url('/fonts/ibm-plex-sans-arabic-700.woff2') format('woff2');
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f3f6f4;
        color: #17302b;
        font-family: 'IBM Plex Sans Arabic', 'Noto Naskh Arabic', system-ui, sans-serif;
        transition: opacity 500ms ease;
      }
      #splash.splash-hide { opacity: 0; pointer-events: none; }
      /* One calm fade, no movement. */
      #splash > * { animation: splash-fade 900ms ease-out both; }
      #splash .name { animation-delay: 250ms; }
      #splash .tagline { animation-delay: 500ms; }
      #splash .tile {
        width: 112px;
        height: 112px;
        border-radius: 30px;
        background: #2f6f66;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 74px;
        font-weight: 700;
        line-height: 1;
        padding-bottom: 12px;
      }
      #splash .name { font-size: 30px; font-weight: 700; }
      #splash .tagline { font-size: 15px; color: #51655f; }
      @keyframes splash-fade { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-color-scheme: dark) {
        #splash { background: #0f1b18; color: #e6f0ec; }
        #splash .tagline { color: #a3b6b0; }
        #splash .tile { background: #3f8f84; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash > * { animation: none; transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="tile">ر</div>
      <div class="name">رفيق</div>
      <div class="tagline">يرافقني في رحلة العناية بنفسي</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
